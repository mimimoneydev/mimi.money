<VirtualHost *:80>
    ServerName x402.mimi.money

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:4402/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:4402/

    ErrorLog ${APACHE_LOG_DIR}/x402.mimi.money_error.log
    CustomLog ${APACHE_LOG_DIR}/x402.mimi.money_access.log combined

    RewriteEngine On
    RewriteCond %{SERVER_NAME} =x402.mimi.money
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
