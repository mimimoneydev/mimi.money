<VirtualHost *:80>
    ServerName agenticous.mimi.money

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:4410/ connectiontimeout=5 timeout=30 retry=0
    ProxyPassReverse / http://127.0.0.1:4410/

    ErrorLog ${APACHE_LOG_DIR}/agenticous.mimi.money_error.log
    CustomLog ${APACHE_LOG_DIR}/agenticous.mimi.money_access.log combined
</VirtualHost>
