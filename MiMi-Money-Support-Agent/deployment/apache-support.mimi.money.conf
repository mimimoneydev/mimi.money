<VirtualHost *:80>
    ServerName support.mimi.money
    DocumentRoot /var/www/support.mimi.money

    <Directory /var/www/support.mimi.money>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/support.mimi.money/application>
        Require all denied
    </Directory>

    <Directory /var/www/support.mimi.money/system>
        Require all denied
    </Directory>

    <Directory /var/www/support.mimi.money/iii>
        Require all denied
    </Directory>

    <Directory /var/www/support.mimi.money/deployment>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/support.mimi.money_error.log
    CustomLog ${APACHE_LOG_DIR}/support.mimi.money_access.log combined
</VirtualHost>
